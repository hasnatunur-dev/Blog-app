<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
        }

        .register-card {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .register-title {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #444;
        }

        form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
        }

        form input:focus {
            border-color: #86b7fe;
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .register-btn {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-weight: 600;
        }

        .helptext {
            font-size: 13px;
            color: #6c757d;
        }

        ul.errorlist {
            color: #dc3545;
            font-size: 14px;
            padding-left: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="register-card">

        <h2 class="register-title">Create Account</h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary register-btn">
                Register
            </button>

        </form>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
